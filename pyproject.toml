[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neodermo"
version = "0.1.0"
description = "A mobile-first wound-care journal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "python-dotenv==1.2.3",
    "argon2-cffi==25.1.0",  # Maintained Argon2id password hashing.
    "email-validator==2.3.0",  # Shared email syntax validation and normalization.
    "Flask-Limiter==4.1.1",  # Independent, bounded auth request limits.
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neodermo.auth" = ["data/*.gz", "data/*.txt", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
