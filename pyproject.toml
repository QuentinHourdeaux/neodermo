[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neodermo"
version = "0.1.0"
description = "A mobile-first wound-care journal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
    "flask-sqlalchemy==3.1.1",
    "flask-migrate==4.1.0",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
